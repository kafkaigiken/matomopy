[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matomopy"
description = "A Python client for the Matomo Reporting (HTTP) API and Tracking API."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Iqbal Abdullah", email = "iqbal@lalokalabs.co" }]
keywords = ["matomo", "piwik", "analytics", "reporting-api", "tracking-api"]
dynamic = ["version"]
dependencies = [
    # urllib3 1.26 is the first release whose Retry accepts allowed_methods,
    # which client.py uses to configure automatic retries.
    "requests>=2.20",
    "urllib3>=1.26",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
]

[project.urls]
Homepage = "https://github.com/kafkaigiken/matomopy"
"Matomo API docs" = "https://developer.matomo.org/api-reference/reporting-api"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "matomopy._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
